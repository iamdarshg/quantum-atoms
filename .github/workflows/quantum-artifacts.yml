name: Quantum reaction path artifacts
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/quantum-artifacts.yml"
      - "src/molecular_dirac_sim/**"
      - "pyproject.toml"
jobs:
  simulate:
    name: ${{ matrix.system }} CASSCF wavepacket
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: water
            points: 17
            r_min: "0.78"
            r_max: "6.0"
            grid_size: 40
            initial_r: "4.8"
          - system: methane
            points: 13
            r_min: "0.9"
            r_max: "5.5"
            grid_size: 32
            initial_r: "4.6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scientific dependencies
        run: python -m pip install -e '.[science]'
      - name: Install video encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Compute CASSCF path and electron densities
        run: >-
          python -m molecular_dirac_sim.science_cli scan "${{ matrix.system }}"
          --points "${{ matrix.points }}"
          --r-min "${{ matrix.r_min }}"
          --r-max "${{ matrix.r_max }}"
          --grid-size "${{ matrix.grid_size }}"
          --basis cc-pVDZ
          --threads 4
          --out results
      - name: Propagate nuclear packet and render electron-density video
        run: >-
          python -m molecular_dirac_sim.science_cli wavepacket
          "results/${{ matrix.system }}_cc-pVDZ_casscf_path.npz"
          --collision-k 1000
          --initial-r "${{ matrix.initial_r }}"
          --frames 45
          --out "results/${{ matrix.system }}_electron_cloud.mp4"
      - name: Upload scan, video, and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: quantum-${{ matrix.system }}-outputs
          path: |
            results/${{ matrix.system }}_cc-pVDZ_casscf_path.npz
            results/${{ matrix.system }}_electron_cloud.mp4
            results/${{ matrix.system }}_electron_cloud.json
          if-no-files-found: error
          retention-days: 14
