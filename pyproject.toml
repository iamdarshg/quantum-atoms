[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-dirac-sim"
version = "0.1.0"
description = "A GPU-capable real-time Dirac spinor solver in prescribed molecular electromagnetic fields"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
gpu = ["torch>=2.2"]
gui = ["streamlit>=1.40", "plotly>=5.24"]
test = ["pytest>=8"]

[project.scripts]
molecular-dirac-demo = "molecular_dirac_sim.formation_demo:main"
molecular-dirac-gui = "molecular_dirac_sim.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
