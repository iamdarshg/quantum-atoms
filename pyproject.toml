[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-atoms"
version = "0.1.0"
description = "All-electron molecular electronic structure and reduced-dimensional reactive-path experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.12", "matplotlib>=3.7"]

[project.optional-dependencies]
gpu = ["torch>=2.2"]
gui = ["streamlit>=1.40", "plotly>=5.24"]
test = ["pytest>=8"]
science = ["pyscf>=2.7", "pyscf-properties>=0.1.0", "h5py>=3.10"]

[project.scripts]
molecular-dirac-demo = "molecular_dirac_sim.formation_demo:main"
molecular-dirac-gui = "molecular_dirac_sim.gui:main"
quantum-atoms = "molecular_dirac_sim.science_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
